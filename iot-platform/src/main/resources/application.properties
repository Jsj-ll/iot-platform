service.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/iot_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log_impl=org.apache.ibatis.logging.stdout.StdOutImpl
#redis??
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.data.mongodb.uri=mongodb://localhost:27017/iot_data

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=iot-group
spring.kafka.consumer.auto-offset-reset=earliest